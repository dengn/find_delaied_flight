name: Flight Delay Monitor

on:
  schedule:
    # 北京时间 07:00-21:00，每 2 小时运行一次（共 8 次/天）
    # 北京 = UTC+8，所以 07:00 BJT = 23:00 UTC (前一天)
    # 对应 BJT 07/09/11/13/15/17/19/21 点
    #     = UTC 23/01/03/05/07/09/11/13 点
    - cron: '0 23,1,3,5,7,9,11,13 * * *'

  # 支持手动触发（测试用）
  workflow_dispatch:
    inputs:
      hub:
        description: '枢纽机场 (留空=全部)'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    # 全量扫描推算：690 次请求 × 1.41 秒 = 16 分钟，
    # 加 7 把 Key 的获取开销（1×112s + 6×90s）≈ 11 分钟，合计约 27 分钟。
    # cron 已放宽到 2 小时一次，不再受 30 分钟间隔约束，故留足余量。
    timeout-minutes: 36
    env:
      NOTIFY_EMAIL: 'nicolasdeng1989@gmail.com'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 恢复去重缓存（跨运行持久化）
      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: .notified_cache.json
          key: dedup-${{ github.run_id }}
          restore-keys: dedup-

      # 恢复跟踪缓存（跨运行持久化飞机调换跟踪）
      - name: Restore tracking cache
        uses: actions/cache@v4
        with:
          path: .tracking_cache.json
          key: tracking-${{ github.run_id }}
          restore-keys: tracking-

      # 恢复检测日志（跨运行持久化，供验证器分析）
      - name: Restore detection log
        uses: actions/cache@v4
        with:
          path: .detection_log.json
          key: detlog-${{ github.run_id }}
          restore-keys: detlog-

      # 运行检测 + 自动邮件通知 + 飞机调换跟踪 + 检测日志
      # 超时放在步骤级而非 job 级：job 级超时会整体 cancel，
      # 导致后面的缓存保存步骤被跳过（检测日志因此长期为空）。
      # 步骤级超时 + continue-on-error 则只中断扫描本身，
      # 验证器和缓存保存照常执行。
      - name: Run detection
        timeout-minutes: 32
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          HUB_ARG=""
          if [ -n "${{ github.event.inputs.hub }}" ]; then
            HUB_ARG="--hub ${{ github.event.inputs.hub }}"
          fi
          python find_delayed_flights.py \
            --auto-renew \
            --smart-scan \
            --email "$NOTIFY_EMAIL" \
            --dedup-file .notified_cache.json \
            --track-file .tracking_cache.json \
            --detection-log .detection_log.json \
            --json \
            $HUB_ARG \
            2>&1 || true
          # exit 0: 无机会; exit 1: 有机会 (已通过邮件通知)
          # || true: 无论结果如何都继续（保存缓存）

      # 运行验证器 — 检查历史预测的准确性，不靠谱的自动提 Issue + 发邮件
      - name: Validate predictions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python validate_detections.py \
            --auto-renew \
            --log .detection_log.json \
            --email "$NOTIFY_EMAIL" \
            -v \
            2>&1 || true
